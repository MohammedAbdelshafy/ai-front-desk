[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-front-desk"
version = "0.1.0"
description = "WhatsApp AI front-desk reference build: pure-Python qualification state machine, Meta webhook dev harness, and the n8n production workflow."
authors = [{name = "Mohammed Abdelshafy"}]
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }

[project.scripts]
ai-front-desk-webhook = "ai_front_desk.webhook:main"

[tool.setuptools.packages.find]
include = ["ai_front_desk*"]

[tool.setuptools.package-data]
ai_front_desk = ["n8n_workflow.json", ".env.example"]
"ai_front_desk.clinical" = ["dental_intake_v1.json", "static/*.webp"]
