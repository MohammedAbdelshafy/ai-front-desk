name: Mia OB-GYN web build

on:
  push:
    branches:
      - "feat/mia-clinical-os"
      - "main"
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies, typecheck and build
        working-directory: apps/mia-obgyn
        run: |
          npm ci
          npm run typecheck
          npm run build
