name: Mia Dental Web

on:
  push:
    branches:
      - main
      - "docs/**"
      - "feat/**"
    paths:
      - "apps/mia-dental/**"
      - ".github/workflows/mia-dental-web.yml"
  pull_request:
    paths:
      - "apps/mia-dental/**"
      - ".github/workflows/mia-dental-web.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/mia-dental
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install
      - name: Type-check
        run: npm run typecheck
      - name: Build
        run: npm run build
